name: bharatse
description: "BharatSe. From the people of Bharat, for Bharat."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.10
  path_drawing: ^1.0.1

  # Identity. Firebase authenticates; the API maps that to a Postgres user and
  # stays the source of truth for role and verification state.
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.4
  google_sign_in: ^6.2.2

  # Landing background
  video_player: ^2.9.2

  # Network
  http: ^1.2.2
  http_parser: ^4.1.0

  # Capture. `record` emits 16 kHz mono WAV natively, which is exactly what the
  # API wants, so there is no audio conversion step anywhere in this app.
  # Pinned to 6.x: record 7 needs Dart 3.12 and this Flutter ships 3.11.5.
  # Upgrading Flutter the night before a demo is not a trade worth making.
  record: ^6.0.0
  speech_to_text: ^7.0.0
  image_picker: ^1.1.2
  permission_handler: ^12.0.0

  # Local first storage and the sync outbox
  drift: ^2.23.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  connectivity_plus: ^7.0.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  drift_dev: ^2.23.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/svg/
    - assets/map/
    - assets/video/

  fonts:
    - family: Playfair
      fonts:
        - asset: assets/fonts/PlayfairDisplay-Variable.ttf

    - family: Tiro
      fonts:
        - asset: assets/fonts/TiroDevanagariHindi-Regular.ttf

    - family: NotoSerifDev
      fonts:
        - asset: assets/fonts/NotoSerifDevanagari-Variable.ttf

    - family: Mukta
      fonts:
        - asset: assets/fonts/Mukta-Light.ttf
          weight: 300
        - asset: assets/fonts/Mukta-Regular.ttf
          weight: 400
        - asset: assets/fonts/Mukta-Medium.ttf
          weight: 500
        - asset: assets/fonts/Mukta-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Mukta-Bold.ttf
          weight: 700
